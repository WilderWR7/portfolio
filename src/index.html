    <title>DevPortfolio | Desarrollador Web y Especialista Full Stack</title>
    <meta name="description"
      content="Portafolio personal de desarrollador web moderno, responsivo y dinámico, construido con HTML5 y Tailwind CSS." />

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark) || !theme) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
