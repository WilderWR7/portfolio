 <body
    class="bg-[#fcfdfd] dark:bg-[#0b1120] text-slate-800 dark:text-slate-100 transition-colors duration-300 font-sans selection:bg-[#ff6b2b]/20 selection:text-[#ff6b2b] min-h-screen flex flex-col">

    <!-- HEADER / NAVIGATION -->
    <app-header></app-header>

    <!-- MAIN CONTENT -->
    <app-main-section [name]="name" [projects]="projects"></app-main-section>

    <!-- FOOTER (Exact replica of mockup footer) -->
    <app-footer [name]="name"></app-footer>

    <!-- PROJECT DETAIL MODAL -->
    <div id="project-modal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-slate-900/70 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none">
        <div id="modal-content"
            class="bg-white dark:bg-slate-900 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 dark:border-slate-800 transform scale-95 transition-all duration-300">

            <!-- Modal Header with Image -->
            <div
                class="relative h-64 sm:h-80 w-full overflow-hidden bg-slate-100 dark:bg-slate-800 rounded-t-3xl">
                <img id="modal-image" src alt="Project Preview"
                    class="w-full h-full object-cover" />
                <button id="modal-close"
                    class="absolute top-4 right-4 p-2.5 rounded-full bg-slate-900/60 text-white hover:bg-slate-900/90 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24"><path stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <span id="modal-category"
                    class="absolute bottom-4 left-4 px-3.5 py-1 rounded-full bg-[#ff6b2b] text-white font-semibold text-xs shadow-md"></span>
            </div>

            <!-- Modal Body -->
            <div class="p-6 sm:p-8 space-y-6">
                <h3 id="modal-title"
                    class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white"></h3>

                <!-- Tags -->
                <div id="modal-tags" class="flex flex-wrap gap-2"></div>

                <p id="modal-desc"
                    class="text-slate-600 dark:text-slate-300 leading-relaxed text-base"></p>

                <div
                    class="pt-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center gap-4">
                    <a id="modal-demo" href="#" target="_blank"
                        rel="noopener noreferrer"
                        class="flex items-center gap-2 px-6 py-3 bg-[#ff6b2b] hover:bg-[#e55a1d] text-white font-semibold rounded-full shadow-md transition-all">
                        <span>Demo en Vivo</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24"><path stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="2"
                                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                    <a id="modal-github" href="#" target="_blank"
                        rel="noopener noreferrer"
                        class="flex items-center gap-2 px-6 py-3 border border-slate-200 dark:border-slate-700 hover:border-[#ff6b2b] text-slate-800 dark:text-slate-200 font-semibold rounded-full transition-all">
                        <span>Código Fuente</span>
                        <svg class="w-4 h-4" fill="currentColor"
                            viewBox="0 0 24 24"><path fill-rule="evenodd"
                                clip-rule="evenodd"
                                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path></svg>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
