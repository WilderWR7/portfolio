 <header
    class="fixed top-0 left-0 right-0 z-50 bg-white/85 dark:bg-[#0f172a]/85 backdrop-blur-md border-b border-slate-100 dark:border-slate-800/80 transition-all duration-300 shadow-sm"
    id="navbar">
    <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

        <!-- Logo -->
        <a href="#home" (click)="scrollToSection($event, '#home')"
            class="flex items-center gap-2 group focus:outline-none">
            <span
                class="text-[#ff6b2b] font-bold text-2xl tracking-tighter transition-transform duration-300 group-hover:scale-110">&lt;/&gt;</span>
            <span
                class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Dev<span
                    class="text-[#ff6b2b]">Portfolio</span></span>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden md:flex items-center gap-1 lg:gap-2">
            @for (url of urls; track $index) {
                <a href="{{ url.path }}"
                    (click)="scrollToSection($event, url.path)"
                    [class]="activeSection() === url.path
                        ? 'nav-link px-4 py-2 rounded-full font-semibold text-sm text-[#ff6b2b] relative after:absolute after:bottom-1 after:left-4 after:right-4 after:h-0.5 after:bg-[#ff6b2b] after:rounded-full transition-all duration-300'
                        : 'nav-link px-4 py-2 rounded-full font-medium text-sm text-slate-600 dark:text-slate-300 hover:text-[#ff6b2b] dark:hover:text-[#ff6b2b] transition-all duration-300'">
                    {{ url.name }}
                </a>
            }
        </nav>

        <!-- Right Action Controls (Theme toggle + Hamburger) -->
        <div class="flex items-center gap-3 sm:gap-4">
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" aria-label="Toggle Dark Mode"
                (click)="toggleTheme()"
                class="p-2.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-orange-50 dark:hover:bg-slate-700 hover:text-[#ff6b2b] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/50">
                @if (isDarkMode()) {
                    <!-- Sun Icon (shown in dark mode) -->
                    <svg id="sun-icon"
                        class="w-5 h-5 transition-transform duration-300 hover:rotate-90 text-amber-400"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                } @else {
                    <!-- Moon Icon (shown in light mode) -->
                    <svg id="moon-icon"
                        class="w-5 h-5 transition-transform duration-300 hover:rotate-12 text-slate-700"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                }
            </button>

            <!-- Mobile Hamburger Button -->
            <button id="mobile-menu-btn" aria-label="Open Menu"
                (click)="toggleMobileMenu()"
                class="md:hidden p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:text-[#ff6b2b] focus:outline-none">
                <svg id="hamburger-icon" class="w-6 h-6" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

    </div>

    <!-- Mobile Dropdown Menu -->
    @if (isMobileMenuOpen()) {
        <div id="mobile-menu"
            class="md:hidden bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800 px-6 py-5 shadow-2xl transition-all duration-300">
            <nav class="flex flex-col gap-3">
                @for (url of urls; track $index) {
                    <a href="{{ url.path }}"
                        (click)="scrollToSection($event, url.path)"
                        [class]="activeSection() === url.path
                            ? 'mobile-nav-link text-base font-semibold text-[#ff6b2b] py-2 px-4 rounded-xl bg-orange-50 dark:bg-slate-800/80 transition-all'
                            : 'mobile-nav-link text-base font-medium text-slate-700 dark:text-slate-300 hover:text-[#ff6b2b] hover:bg-slate-50 dark:hover:bg-slate-800/40 py-2 px-4 rounded-xl transition-all'">
                        {{ url.name }}
                    </a>
                }
            </nav>
        </div>
    }
</header>
