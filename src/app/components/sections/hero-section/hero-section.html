 <section id="home"
    class="relative overflow-hidden pt-8 pb-16 md:pt-16 md:pb-24">
    <!-- Background subtle glow patterns -->
    <div
        class="absolute top-1/4 left-10 w-72 h-72 bg-orange-300/15 dark:bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div
        class="absolute bottom-10 right-10 w-96 h-96 bg-amber-400/10 dark:bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div
            class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center">

            <!-- Hero Left Text Column -->
            <div
                class="lg:col-span-7 space-y-6 text-center lg:text-left order-2 lg:order-1">

                <div
                    class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-orange-50 dark:bg-orange-950/40 border border-orange-200/60 dark:border-orange-800/40 text-orange-600 dark:text-orange-400 font-medium text-sm animate-bounce sm:animate-none">
                    <span id="hero-greeting" class="font-semibold">Hi
                        there! 👋, I'm</span>
                </div>

                <div>
                    <h1 id="hero-name"
                        class="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">
                        Tu Nombre
                    </h1>
                    <h2 id="hero-role"
                        class="text-3xl sm:text-5xl lg:text-6xl font-bold text-[#ff6b2b] mt-1 sm:mt-2">
                        Web Developer
                    </h2>
                </div>

                <p id="hero-tagline"
                    class="text-slate-600 dark:text-slate-300 text-base sm:text-lg lg:text-xl max-w-xl mx-auto lg:mx-0 leading-relaxed font-normal">
                    I build responsive, user-friendly websites and web
                    applications that deliver great user experiences.
                </p>

                <!-- Hero Buttons -->
                <div
                    class="flex flex-wrap items-center justify-center lg:justify-start gap-4 pt-2">
                    <a href="#projects"
                        class="inline-flex items-center gap-2.5 bg-[#ff6b2b] hover:bg-[#e55a1d] text-white px-7 py-4 rounded-full font-semibold text-base shadow-xl shadow-orange-500/25 hover:shadow-orange-500/40 hover:-translate-y-1 transition-all duration-300 group">
                        <span>Ver mi trabajo</span>
                        <svg
                            class="w-5 h-5 transition-transform group-hover:translate-x-1"
                            fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </a>

                    <a href="#contact"
                        class="inline-flex items-center gap-2.5 bg-white dark:bg-slate-800/90 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:border-[#ff6b2b] dark:hover:border-[#ff6b2b] px-7 py-4 rounded-full font-semibold text-base shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300">
                        <span>Contáctame</span>
                        <svg class="w-5 h-5 text-[#ff6b2b]" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </a>
                </div>

                <!-- Social Links Row -->
                <div
                    class="pt-6 border-t border-slate-200/60 dark:border-slate-800/80 flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4">
                    <span
                        class="text-sm font-semibold text-slate-500 dark:text-slate-400">Encuéntrame
                        en</span>
                    <div id="hero-socials"
                        class="flex items-center gap-3">
                        <!-- Injected via JS -->
                    </div>
                </div>

            </div>

            <!-- Hero Right Portrait Column -->
            <div
                class="lg:col-span-5 relative flex justify-center items-center order-1 lg:order-2">

                <!-- Decorative Dots Pattern Left -->
                <div
                    class="absolute -top-6 left-2 sm:left-10 text-orange-400/40 dark:text-orange-500/30 select-none pointer-events-none hidden sm:block">
                    <svg class="w-20 h-20" fill="currentColor"
                        viewBox="0 0 100 100">
                        <pattern id="dots" x="0" y="0" width="20"
                            height="20" patternUnits="userSpaceOnUse">
                            <circle cx="3" cy="3" r="3" />
                        </pattern>
                        <rect width="100" height="100"
                            fill="url(#dots)" />
                    </svg>
                </div>

                <!-- Main Organic Orange Blob Background -->
                <div
                    class="relative w-72 h-72 sm:w-96 sm:h-96 lg:w-[420px] lg:h-[420px] flex items-center justify-center">
                    <!-- Blob shape -->
                    <div
                        class="absolute inset-0 bg-gradient-to-tr from-[#ff6b2b] via-[#ff8f4d] to-[#ffbe80] rounded-[48%_52%_68%_32%/42%_55%_45%_58%] shadow-2xl shadow-orange-500/20 animate-pulse-slow"></div>

                    <!-- Inner glow / ring -->
                    <div
                        class="absolute -inset-2 rounded-[52%_48%_35%_65%/58%_45%_55%_42%] border-2 border-[#ff6b2b]/30 dark:border-[#ff6b2b]/20 pointer-events-none"></div>

                    <!-- Developer Image -->
                    <div
                        class="relative z-10 w-64 h-64 sm:w-84 sm:h-84 lg:w-96 lg:h-96 rounded-full overflow-hidden border-4 border-white dark:border-slate-800 shadow-2xl flex items-center justify-center bg-slate-100 dark:bg-slate-800">
                        <img id="hero-avatar"
                            src="/assets/developer.png"
                            alt="Developer Portrait"
                            class="w-full h-full object-cover object-top hover:scale-105 transition-transform duration-500" />
                    </div>

                    <!-- Floating Badge: Available for Freelance -->
                    <div
                        class="absolute bottom-4 right-0 sm:-right-4 z-20 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md shadow-2xl border border-slate-100 dark:border-slate-700/80 px-4 py-2.5 rounded-2xl flex items-center gap-2.5 animate-float">
                        <span class="relative flex h-3 w-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span
                                class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        <span id="hero-status"
                            class="font-semibold text-xs sm:text-sm text-slate-800 dark:text-slate-200 whitespace-nowrap">Available
                            for Freelance</span>
                    </div>

                    <!-- Small Decorative Ring -->
                    <div
                        class="absolute top-2 right-6 w-5 h-5 rounded-full border-2 border-orange-400 pointer-events-none"></div>
                    <div
                        class="absolute bottom-10 -left-6 w-4 h-4 rounded-full bg-amber-400/60 pointer-events-none"></div>
                </div>

            </div>

        </div>

        <!-- Scroll Down Indicator -->
        <div
            class="mt-12 flex flex-col items-center justify-center gap-2 text-slate-400 dark:text-slate-500">
            <a href="#dashboard" aria-label="Scroll down"
                class="p-2 hover:text-[#ff6b2b] transition-colors">
                <svg
                    class="w-6 h-10 border-2 border-current rounded-full p-1 animate-bounce"
                    fill="none" stroke="currentColor"
                    viewBox="0 0 24 40">
                    <circle cx="12" cy="10" r="3" fill="currentColor" />
                </svg>
            </a>
        </div>

    </div>
</section>
