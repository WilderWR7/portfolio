 <section id="experience" class="py-20 md:py-28">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="text-center max-w-3xl mx-auto mb-16">
            <span
                class="text-[#ff6b2b] font-bold text-sm tracking-wider uppercase">Trayectoria
                Profesional</span>
            <h2
                class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white mt-2">Experiencia
                Laboral</h2>
            <div
                class="w-16 h-1.5 bg-[#ff6b2b] rounded-full mx-auto mt-4"></div>
        </div>

        <!-- Timeline Container -->
        <div
            class="relative pl-6 sm:pl-10 border-l-2 border-slate-200 dark:border-slate-800 space-y-12"
            id="experience-timeline">
            @for (exp of experience; track $index) {
            <div class="relative group">
                <!-- Node point -->
                <span
                    class="absolute -left-[31px] sm:-left-[47px] top-1.5 w-6 h-6 rounded-full bg-white dark:bg-slate-900 border-4 border-[#ff6b2b] shadow-md group-hover:scale-125 transition-transform"></span>

                <div
                    class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-3xl border border-slate-100 dark:border-slate-700/80 shadow-lg hover:border-[#ff6b2b] transition-all space-y-2">
                    <div
                        class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                        <h3
                            class="text-xl font-bold text-slate-900 dark:text-white">{{exp.role}}</h3>
                        <span
                            class="text-xs font-bold px-3 py-1 rounded-full bg-orange-100 dark:bg-orange-950/60 text-[#ff6b2b] self-start sm:self-auto">{{exp.period}}</span>
                    </div>
                    <h4
                        class="text-sm font-semibold text-slate-500 dark:text-slate-400">{{exp.company}}</h4>
                    <p
                        class="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed pt-2">{{exp.description}}</p>
                </div>
            </div>
            }

        </div>

    </div>
</section>
