<section id="contact" class="py-20 md:py-28">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="text-center max-w-3xl mx-auto mb-16">
            <span
                class="text-[#ff6b2b] font-bold text-sm tracking-wider uppercase">Ponte
                en Contacto</span>
            <h2
                class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white mt-2">Conectemos
                y Construyamos</h2>
            <div
                class="w-16 h-1.5 bg-[#ff6b2b] rounded-full mx-auto mt-4"></div>
            <p
                class="text-slate-600 dark:text-slate-300 text-base sm:text-lg mt-4">¿Tienes
                un proyecto en mente, alguna pregunta o simplemente
                quieres saludar? ¡No dudes en contactarme en cualquier
                momento!</p>
        </div>

        <div class="max-w-2xl mx-auto">

            <!-- Contact Info -->
            <div class="space-y-6">
                <div
                    class="bg-white dark:bg-slate-800/80 rounded-3xl p-8 border border-slate-100 dark:border-slate-700/80 shadow-xl space-y-6">

                    <h3
                        class="text-2xl font-bold text-slate-900 dark:text-white text-center">Información
                        de Contacto</h3>
                    <p
                        class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed text-center"
                        id="contact-availability">
                        <!-- Injected via JS -->
                    </p>

                    <div
                        class="space-y-4 pt-4 flex flex-col items-center">
                        <!-- Email -->
                        <div
                            class="flex items-center gap-4 w-full max-w-md justify-start">
                            <span
                                class="p-3 rounded-2xl bg-orange-50 dark:bg-orange-950/50 text-[#ff6b2b]">
                                <svg class="w-6 h-6" fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"><path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            </span>
                            <div>
                                <span
                                    class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Enviar
                                    Correo</span>
                                <a id="contact-email"
                                    href="mailto:hola@tucorreo.com"
                                    class="block font-semibold text-slate-800 dark:text-slate-200 hover:text-[#ff6b2b] transition-colors mt-0.5">hola@tucorreo.com</a>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div
                            class="flex items-center gap-4 w-full max-w-md justify-start"
                            id="contact-phone-container">
                            <span
                                class="p-3 rounded-2xl bg-orange-50 dark:bg-orange-950/50 text-[#ff6b2b]">
                                <svg class="w-6 h-6" fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"><path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            </span>
                            <div>
                                <span
                                    class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Llamar</span>
                                <a id="contact-phone"
                                    href="tel:+34600123456"
                                    class="block font-semibold text-slate-800 dark:text-slate-200 hover:text-[#ff6b2b] transition-colors mt-0.5">+34
                                    600 123 456</a>
                            </div>
                        </div>

                        <!-- Location -->
                        <div
                            class="flex items-center gap-4 w-full max-w-md justify-start">
                            <span
                                class="p-3 rounded-2xl bg-orange-50 dark:bg-orange-950/50 text-[#ff6b2b]">
                                <svg class="w-6 h-6" fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"><path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </span>
                            <div>
                                <span
                                    class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Ubicación</span>
                                <span id="contact-location"
                                    class="block font-semibold text-slate-800 dark:text-slate-200 mt-0.5">Madrid,
                                    España</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>
</section>
