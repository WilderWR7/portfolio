 <section id="skills" class="py-20 md:py-28">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="text-center max-w-3xl mx-auto mb-16">
            <span
                class="text-[#ff6b2b] font-bold text-sm tracking-wider uppercase">Mi
                Stack Tecnológico</span>
            <h2
                class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white mt-2">Habilidades
                y Tecnologías</h2>
            <div
                class="w-16 h-1.5 bg-[#ff6b2b] rounded-full mx-auto mt-4"></div>
            <p
                class="text-slate-600 dark:text-slate-300 text-base sm:text-lg mt-4">Estas
                son las principales herramientas y tecnologías que
                utilizo para construir aplicaciones web de extremo a
                extremo.</p>
        </div>

        <!-- Skills Cards Grid -->
        <div id="full-skills-grid"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            @for (skill of skills; track $index) {
            <div
                class="p-6 rounded-3xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/80 shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full shadow-sm"
                            [style.backgroundColor]="skill.color"></span>
                        <h4
                            class="text-lg font-bold text-slate-900 dark:text-white">{{skill.name}}</h4>
                    </div>
                    <span
                        class="text-xs font-bold px-3 py-1 rounded-full bg-orange-50 dark:bg-orange-950/40 text-[#ff6b2b]">{{skill.percentage}}%
                        de Dominio</span>
                </div>
                <div
                    class="h-2.5 w-full bg-slate-100 dark:bg-slate-700/60 rounded-full overflow-hidden">
                    <div
                        class="h-full bg-gradient-to-r from-orange-400 to-[#ff6b2b] rounded-full transition-all duration-1000 ease-out skill-progress"
                        [attr.data-percentage]="skill.percentage"
                        style="width: 0%"></div>
                </div>
            </div>
            }
        </div>

    </div>
</section>
